<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <!-- Home: house -->
  <symbol id="nav-home" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9.2 10 3.2l7 6" />
    <path d="M4.6 8v8.4a.9.9 0 0 0 .9.9h9a.9.9 0 0 0 .9-.9V8" />
    <path d="M8.3 17.3v-4.2h3.4v4.2" />
  </symbol>

  <!-- Time tracking: clock -->
  <symbol id="nav-time-tracking" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7" />
    <path d="M10 5.4V10l3.1 1.9" />
  </symbol>

  <!-- Clients: group of people -->
  <symbol id="nav-clients" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="7.5" r="2.5" />
    <path d="M2.5 16.5a4.5 4.5 0 0 1 9 0" />
    <circle cx="14" cy="8" r="2.2" />
    <path d="M12.2 16.5a4.2 4.2 0 0 1 5.3-1.6" />
  </symbol>

  <!-- Issuers: bank / institution -->
  <symbol id="nav-issuers" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8 10 4.2 17 8" />
    <path d="M4.2 8.2v6.4M8 8.2v6.4M12 8.2v6.4M15.8 8.2v6.4" />
    <path d="M2.6 16.6h14.8" />
  </symbol>

  <!-- Units: cube / box -->
  <symbol id="nav-units" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2.9 16.3 6.1v7.8L10 17.1 3.7 13.9V6.1L10 2.9Z" />
    <path d="M3.7 6.1 10 9.3l6.3-3.2M10 9.3v7.8" />
  </symbol>

  <!-- Projects: folder -->
  <symbol id="nav-projects" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h3.7l1.8 2.2h5.5A1.5 1.5 0 0 1 17 8.7v5.8A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5v-8Z" />
  </symbol>

  <!-- Invoice templates: document with text -->
  <symbol id="nav-invoice-templates" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.2 3.5h5.5l3.8 3.6v9.4a1 1 0 0 1-1 1H5.2a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1Z" />
    <path d="M10.7 3.5v3.6h3.8" />
    <path d="M6.7 11h6.3M6.7 13.5h4.3" />
  </symbol>

  <!-- System settings: gear -->
  <symbol id="nav-system-settings" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="2.6" />
    <circle cx="10" cy="10" r="6.3" />
    <path d="M10 3.7V2.3M10 17.7v-1.4M3.7 10H2.3M17.7 10h-1.4M5.6 5.6 4.6 4.6M14.4 14.4l-.9-.9M14.4 5.6l.9-.9M5.6 14.4l-.9.9" />
  </symbol>

  <!-- Users: single person -->
  <symbol id="nav-users" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="7" r="3" />
    <path d="M4 16.5a6 6 0 0 1 12 0" />
  </symbol>

  <!-- Default fallback: rounded square -->
  <symbol id="nav-default" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="12" height="12" rx="1.5" />
  </symbol>

  <!-- Sign out: door edge with arrow leaving to the right -->
  <symbol id="nav-signout" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 4H5.2A1.2 1.2 0 0 0 4 5.2v9.6A1.2 1.2 0 0 0 5.2 16H7.5" />
    <path d="M11 7l3 3-3 3" />
    <path d="M14 10H7.5" />
  </symbol>

  <!-- Settings: gear -->
  <symbol id="nav-settings" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="2.6" />
    <path d="M10 3.2v2.1M10 14.7v2.1M3.2 10h2.1M14.7 10h2.1M5.2 5.2l1.5 1.5M13.3 13.3l1.5 1.5M14.8 5.2l-1.5 1.5M6.7 13.3l-1.5 1.5" />
  </symbol>
</svg>
